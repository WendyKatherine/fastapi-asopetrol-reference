services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fastapi-asopetrol-reference}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastapi-asopetrol-reference}
      POSTGRES_DB: ${POSTGRES_DB:-fastapi-asopetrol-reference}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastapi-asopetrol-reference}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: