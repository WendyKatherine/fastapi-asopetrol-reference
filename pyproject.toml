[project]
name = "fastapi-asopetrol-reference"
version = "0.1.0"
description = "Repository showcase ASOPETROL experience backend (Clean Architecture, FastAPI)"
requires-python = ">=3.12"
authors = [
    { name = "Wendy Katherine Gomez", email = "wendykatherinnegomezv@gmail.com" }
]
dependencies = [
    "fastapi>=0.165.0",
    "hatch>=1.18.2",
    "mypy>=2.4.1",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---- Ruff: lint + format (replaces black, isort, flake8) ----
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---- Mypy: strict everywhere; domain & application must stay 100% typed ----
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:app"
plugins = ["pydantic.mypy"]

# ---- Pytest ----
[tool.pytest.ini_options]
markers = [
    "integration: tests that need a real Postgres via testcontainers",
]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
